name: Smoke Test (LLM Pipeline)

on:
  workflow_dispatch:  # manual trigger only

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Train ML categorizer
        run: python scripts/train_categorizer.py

      - name: Run risk assessment smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_MODEL: llama-3.3-70b-versatile
        run: python scripts/smoke_test_risk_assess.py
