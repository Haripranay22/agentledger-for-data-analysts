[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentledger"
version = "0.1.0"
description = "AI-augmented credit analysis workflow — reduces per-file analyst time from 4 hours to 15 minutes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Haripranay Peddagolla", email = "haripranay2129@gmail.com" }]

dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # ML
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # AI / Agent
    "openai>=1.0",
    "langgraph>=0.1",
    "pydantic>=2.6",
    "instructor>=1.2",
    # Reporting
    "jinja2>=3.1",
    # Utils
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
plaid = ["plaid-python>=16.0"]
pdf = ["weasyprint>=60.0"]
llm = ["google-genai>=1.0"]
observability = ["langfuse>=2.0"]
cloud = ["boto3>=1.34"]
dashboard = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]
all = [
    "agentledger[plaid,pdf,llm,observability,cloud,dashboard]",
]

[project.scripts]
agentledger = "agentledger.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
