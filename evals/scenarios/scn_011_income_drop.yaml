scenario_id: "scn_011_income_drop"
description: "Gig worker with one month of zero income — simulates work gap or client loss"
borrower:
  monthly_income: 5000
  income_source: "gig"
  rent: 1500
  nsf_count: 0
  income_drop_month: 2
  months_data: 6
expected:
  risk_score_range: [35, 75]
  recommendation_any_of: ["approve_with_conditions", "approve", "manual_review"]
  must_include_factors: ["income"]
  must_not_include: ["gambling"]
metrics:
  avg_monthly_income: 4167
  income_cv: 0.47
  dti_ratio: 0.31
  nsf_count: 0
  cash_buffer_days: 8
  rent_to_income_ratio: 0.36
