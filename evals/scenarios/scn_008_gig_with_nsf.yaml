scenario_id: "scn_008_gig_with_nsf"
description: "Gig worker with NSF event — dual risk flags: income volatility + overdraft"
borrower:
  monthly_income: 4000
  income_source: "gig"
  rent: 1500
  has_nsf: true
  months_data: 6
expected:
  risk_score_range: [50, 90]
  recommendation_any_of: ["decline", "manual_review", "approve_with_conditions"]
  must_include_factors: ["income"]
  must_not_include: ["gambling"]
metrics:
  avg_monthly_income: 4000
  income_cv: 0.25
  dti_ratio: 0.31
  nsf_count: 1
  cash_buffer_days: 5
  rent_to_income_ratio: 0.375
