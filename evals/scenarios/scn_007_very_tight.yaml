scenario_id: "scn_007_very_tight"
description: "W-2 employee with very low income — monthly expenses structurally exceed income"
borrower:
  monthly_income: 2800
  income_source: "W2"
  rent: 1600
  has_nsf: false
  months_data: 6
expected:
  risk_score_range: [30, 100]
  # LLM sees clean DTI (0.28) and stable W2 — negative buffer; score varies 35-65 across runs
  recommendation_any_of: ["decline", "approve_with_conditions", "manual_review"]
  must_include_factors: ["income"]
  must_not_include: ["gambling"]
metrics:
  avg_monthly_income: 2800
  income_cv: 0.0
  dti_ratio: 0.28
  nsf_count: 0
  cash_buffer_days: -2.8
  rent_to_income_ratio: 0.57
