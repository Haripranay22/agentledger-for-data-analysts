scenario_id: "scn_013_high_income_gig"
description: "High-income gig worker, no NSF — income variability offset by strong earnings"
borrower:
  monthly_income: 8000
  income_source: "gig"
  rent: 2200
  has_nsf: false
  months_data: 6
expected:
  risk_score_range: [20, 60]
  recommendation_any_of: ["approve", "approve_with_conditions"]
  must_include_factors: ["income"]
  must_not_include: ["nsf", "overdraft", "gambling"]
metrics:
  avg_monthly_income: 8000
  income_cv: 0.25
  dti_ratio: 0.31
  nsf_count: 0
  cash_buffer_days: 15
  rent_to_income_ratio: 0.275
