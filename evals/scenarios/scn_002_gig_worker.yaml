scenario_id: "scn_002_gig_worker"
description: "Gig/freelance worker — irregular income, no NSF, moderate risk"
borrower:
  monthly_income: 4200
  income_source: "gig"
  rent: 1400
  has_nsf: false
  months_data: 6
expected:
  # risk_score: 0=lowest risk, 100=highest risk
  risk_score_range: [30, 75]
  # Boundary case: LLM may approve or approve_with_conditions — both valid
  # Income variability is moderate; outcome depends on LLM confidence
  recommendation_any_of: ["approve", "approve_with_conditions"]
  must_include_factors: ["income"]
  must_not_include: ["gambling"]
metrics:
  avg_monthly_income: 4200
  income_cv: 0.27
  dti_ratio: 0.31
  nsf_count: 0
  cash_buffer_days: 7
  rent_to_income_ratio: 0.33
