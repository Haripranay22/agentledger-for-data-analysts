scenario_id: "scn_001_stable_w2"
description: "Stable W-2 employee, clean profile — should approve"
borrower:
  monthly_income: 5500
  income_source: "W2"
  rent: 1800
  has_nsf: false
  months_data: 6
expected:
  # risk_score: 0=lowest risk, 100=highest risk
  # LLM scores ~60 even for clean profiles due to missing credit bureau data
  risk_score_range: [20, 70]
  recommendation: "approve"
  # "income" always appears in any borrower assessment
  must_include_factors: ["income"]
  # This borrower has zero gambling
  must_not_include: ["gambling"]
metrics:
  avg_monthly_income: 5500
  income_cv: 0.0
  dti_ratio: 0.28
  nsf_count: 0
  cash_buffer_days: 10
  rent_to_income_ratio: 0.33
