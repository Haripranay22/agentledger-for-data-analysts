agentledger:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: agentledger
      password: agentledger
      dbname: agentledger
      schema: public
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ANALYST
      database: AGENTLEDGER
      warehouse: COMPUTE_WH
      schema: PUBLIC
      threads: 8
